# Ubuntu 24.04 visual-reference profile. The generic built-in family remains "monospace".
[terminal]
identity = "leyline"

[font]
family = "Ubuntu Sans Mono"
size = 13.0
ligatures = false
hinting = "slight"
antialiasing = "grayscale"
line_spacing = 1.0

[unicode]
# Bidi remains opt-in for terminal applications that already arrange their own cells.
bidi = false
color_glyphs = true

[colors]
foreground = "#d8dcd8"
background = "#2e3436e6"
cursor = "#d8dcd8"
selection_foreground = "#f4f6f4"
selection_background = "#58656dcc"
search_current_foreground = "#171a1c"
search_current_background = "#ffb454"
search_match_foreground = "#f4f6f4"
search_match_background = "#8a6532cc"
ansi = [
  "#2e3436", "#cc6666", "#6fa66f", "#c8a85f",
  "#5f87af", "#a27aa8", "#5f9ea0", "#d3d7cf",
  "#6c7375", "#e07a7a", "#87bd87", "#d8bd73",
  "#7aa2c8", "#b58abb", "#72b2b4", "#eeeeec",
]

[scrollbar]
mode = "auto"
width = 4.0
hit_width = 12.0
min_thumb_size = 24.0
thumb = "#9aa2a680"
thumb_hover = "#c1c7caff"
track = "#00000000"

[tabs]
max_count = 32
bar_height = 32
min_width = 80
max_width = 240
show_close_button = true
# New tabs inherit the active tab's last valid OSC 7 directory by default.
# Other values are "home" or "fixed"; fixed also requires new_tab_fixed_cwd.
new_tab_cwd = "inherit"
# new_tab_fixed_cwd = "/srv/project"

[bell]
enabled = true
visual = false
visual_duration_ms = 120
audible = true
audible_when_unfocused = true
attention = true
# Desktop notifications are enabled by default and always use fixed, non-terminal-derived text.
desktop_notifications = true
notification_cooldown_seconds = 10
notification_burst_per_minute = 6

[behavior]
confirm_multiline_paste = false
